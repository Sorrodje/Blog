name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy vers le Kimsufi (rsync)
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: public/
          remote_path: /var/www/sorrodje.alter-it.org/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_KEY }}
          remote_known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Publication Bluesky des nouveaux billets
        if: github.event_name == 'push'
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${BSKY_IDENTIFIER:-}" ] || [ -z "${BSKY_PASSWORD:-}" ]; then
            echo "Secrets Bluesky manquants — étape ignorée."
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          NEW_POSTS="$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'content/posts/*.md' || true)"
          if [ -z "$NEW_POSTS" ]; then
            echo "Aucun nouveau billet — rien à publier sur Bluesky."
            exit 0
          fi
          TOKEN="$(curl -sf -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg id "$BSKY_IDENTIFIER" --arg pw "$BSKY_PASSWORD" '{identifier:$id, password:$pw}')" \
            | jq -r .accessJwt)"
          for f in $NEW_POSTS; do
            TITLE="$(awk -F'"' '/^title[[:space:]]*=/{print $2; exit}' "$f")"
            if [ -z "$TITLE" ]; then
              TITLE="$(awk -F= '/^title[[:space:]]*=/{sub(/^[^=]*=[[:space:]]*/, ""); print; exit}' "$f")"
            fi
            TEASER="$(awk -F'"' '/^summary[[:space:]]*=/{print $2; exit}' "$f")"
            TEASER="$(printf '%s' "$TEASER" | jq -Rr '.[0:180]')"
            SLUG="$(basename "$f" .md)"
            URL="https://sorrodje.alter-it.org/posts/$SLUG/"
            TEXT="$(jq -rn --arg t "Nouveau billet : « $TITLE »" --arg s "$TEASER" --arg u "$URL" \
              '($t + "\n\n" + $s + "\n\n" + $u)')"
            echo "Publication Bluesky : $URL"
            jq -n --arg text "$TEXT" --arg repo "$BSKY_IDENTIFIER" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{repo: $repo, collection: "app.bsky.feed.post",
                record: {text: $text, createdAt: $ts, langs: ["fr"]}}' \
              | curl -sf -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord \
                  -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d @- > /dev/null
          done
