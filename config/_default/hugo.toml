# -- Configuration principale du site sorrodje.alter-it.org --

baseURL = "https://sorrodje.alter-it.org/"
theme = "congo"
defaultContentLanguage = "fr"
enableRobotsTXT = true
summaryLength = 40
buildFuture = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true